services:
  postgres:
    image: postgres:16-alpine
    container_name: diddymmo-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: diddymmo
      POSTGRES_PASSWORD: diddymmo
      POSTGRES_DB: diddymmo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diddymmo -d diddymmo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
